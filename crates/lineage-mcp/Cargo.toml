[package]
name = "lineage-mcp"
description = "MCP server exposing lineage session data to AI tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lineage_mcp"
path = "src/lib.rs"

[[bin]]
name = "lineage-mcp"
path = "src/main.rs"

[dependencies]
lineage-cli = { workspace = true }
lineage-core = { workspace = true }
lineage-git = { workspace = true }
lineage-policy = { workspace = true }
# A direct dependency, not a reach through lineage-cli: MCP is a sibling
# consumer of retrieval exactly as the CLI is, and routing traversal through a
# binary crate whose handlers print rather than return would make the existing
# `doctor_report` reach-through load-bearing.
lineage-retrieval = { workspace = true }
lineage-search = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
