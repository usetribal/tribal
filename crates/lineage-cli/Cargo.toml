[package]
name = "lineage-cli"
description = "tribal command-line tool for AI agent provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lineage_cli"
path = "src/lib.rs"

[[bin]]
name = "tribal"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
lineage-adapters = { workspace = true }
lineage-agent = { workspace = true }
lineage-core = { workspace = true }
lineage-git = { workspace = true }
lineage-retrieval = { workspace = true }
lineage-embed = { workspace = true }
lineage-policy = { workspace = true }
lineage-search = { workspace = true }
lineage-select = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
tracing-subscriber = { workspace = true }
inquire = { workspace = true }
indicatif = { workspace = true }
anstyle = { workspace = true }
anstream = { workspace = true }
image = { workspace = true }
git2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
git2 = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
