[workspace]
resolver = "2"
members = [
    "crates/lineage-core",
    "crates/lineage-policy",
    "crates/lineage-store",
    "crates/lineage-git",
    "crates/lineage-agent",
    "crates/lineage-adapters",
    "crates/lineage-cli",
    "crates/lineage-search",
    "crates/lineage-embed",
    "crates/lineage-retrieval",
    "crates/lineage-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/lineage-dev/lineage"
homepage = "https://github.com/lineage-dev/lineage"
documentation = "https://github.com/lineage-dev/lineage#readme"
readme = "README.md"
authors = ["Lineage Contributors"]
keywords = ["git", "ai", "provenance", "lineage", "agents", "mcp"]
categories = ["command-line-utilities", "development-tools"]
description = "Git-native provenance for AI coding agents"

[workspace.dependencies]
lineage-core = { path = "crates/lineage-core" }
lineage-policy = { path = "crates/lineage-policy" }
lineage-store = { path = "crates/lineage-store" }
lineage-git = { path = "crates/lineage-git" }
lineage-agent = { path = "crates/lineage-agent" }
lineage-adapters = { path = "crates/lineage-adapters" }
lineage-search = { path = "crates/lineage-search" }
lineage-embed = { path = "crates/lineage-embed" }
lineage-retrieval = { path = "crates/lineage-retrieval" }
lineage-cli = { path = "crates/lineage-cli" }

chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
git2 = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
ulid = { version = "1", features = ["serde"] }
walkdir = "2"
glob = "0.3"
inquire = "0.7"
indicatif = "0.17"
libc = "0.2"
regex = "1"
aho-corasick = "1"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
# model2vec static embedding: a token->vector matrix (safetensors) + the model's
# tokenizer. No ONNX/transformer runtime — lookup + mean-pool + L2-normalize.
# tokenizers is kept to its minimal feature set (onig only, for the WordPiece
# pre-tokenizer); the training/http/progressbar features are not needed here.
safetensors = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
