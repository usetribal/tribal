[workspace]
resolver = "2"
members = [
    "crates/lineage-core",
    "crates/lineage-policy",
    "crates/lineage-store",
    "crates/lineage-git",
    "crates/lineage-agent",
    "crates/lineage-adapters",
    "crates/lineage-cli",
    "crates/lineage-search",
    "crates/lineage-embed",
    "crates/lineage-retrieval",
    "crates/lineage-mcp",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/usetribal/tribal"
homepage = "https://github.com/usetribal/tribal"
documentation = "https://github.com/usetribal/tribal#readme"
readme = "README.md"
authors = ["Lineage Contributors"]
keywords = ["git", "ai", "provenance", "lineage", "agents", "mcp"]
categories = ["command-line-utilities", "development-tools"]
description = "Git-native provenance for AI coding agents"

[workspace.dependencies]
lineage-core = { path = "crates/lineage-core" }
lineage-policy = { path = "crates/lineage-policy" }
lineage-store = { path = "crates/lineage-store" }
lineage-git = { path = "crates/lineage-git" }
lineage-agent = { path = "crates/lineage-agent" }
lineage-adapters = { path = "crates/lineage-adapters" }
lineage-search = { path = "crates/lineage-search" }
lineage-embed = { path = "crates/lineage-embed" }
lineage-retrieval = { path = "crates/lineage-retrieval" }
lineage-cli = { path = "crates/lineage-cli" }

chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
# Local object and ref access only — every network operation (clone, fetch,
# push, LFS) shells out to the user's own `git`, which already holds their
# credentials, SSH agent, and proxy config. libgit2's own transports would
# duplicate all of that, and they are what drags in libssh2 and a dynamically
# linked OpenSSL: a binary that then refuses to start when the host's libssl
# major differs from the build machine's, and cannot be built for musl at all.
# Dropping the default features is what makes a release artifact portable.
git2 = { version = "0.19", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
ulid = { version = "1", features = ["serde"] }
walkdir = "2"
glob = "0.3"
inquire = "0.7"
indicatif = "0.17"
libc = "0.2"
regex = "1"
aho-corasick = "1"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
# model2vec static embedding: a token->vector matrix (safetensors) + the model's
# tokenizer. No ONNX/transformer runtime — lookup + mean-pool + L2-normalize.
# tokenizers is kept to its minimal feature set (onig only, for the WordPiece
# pre-tokenizer); the training/http/progressbar features are not needed here.
safetensors = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Dependencies build optimized even in dev/test: the policy engine compiles 221
# gitleaks regexes at first use, and an unoptimized `regex` spends ~29s on that
# DFA construction in every test binary that touches policy. Optimizing deps
# only (workspace crates stay unoptimized for fast incremental rebuilds and
# usable backtraces) cuts that to ~2.5s.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
