# Pinned to a concrete release, not "stable": a floating channel means CI's
# fresh runner gets a newer clippy than local machines and fails on lints local
# runs never saw. Bump deliberately (and fix new lints in the same change).
# MSRV (1.86) is checked separately via `make msrv`.
[toolchain]
channel = "1.97"
components = ["rustfmt", "clippy"]
