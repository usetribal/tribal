name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: git-lineage
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: git-lineage
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: git-lineage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo build --release --target ${{ matrix.target }} -p lineage-cli -p lineage-mcp
      - name: Package binaries
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/git-lineage dist/
          cp target/${{ matrix.target }}/release/lineage-mcp dist/
          cd dist && tar czf ../lineage-${{ matrix.target }}.tar.gz *
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-${{ matrix.target }}
          path: lineage-${{ matrix.target }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lineage-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: lineage-*.tar.gz
