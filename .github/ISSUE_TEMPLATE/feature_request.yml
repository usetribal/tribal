name: Feature request
description: Suggest an idea for Lineage
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! For large changes, please describe the problem first so we can discuss the approach.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What is the use case?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.

  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: CLI (`git-lineage`)
        - label: MCP server
        - label: VS Code extension
        - label: Agent adapter
        - label: Git storage / schema
        - label: Policy / redaction
        - label: Documentation
